name: Persistent state postflight diagnostics
on:
  push:
    branches: [research/persistent-state-transition]
    paths: ['experiments/persistent-state-postflight/**', '.github/workflows/persistent-state-postflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the exact completed native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 34413214170 --repo curlcomplex/Faust-expr --name persistent-state-next-full-34413214170-1 --dir raw
          mkdir -p review
          python3 - <<'PY' | tee review/diagnostic.log
          import pathlib,json,csv
          root=pathlib.Path('raw/original-regression')
          summary=json.loads((root/'retained-summary.json').read_text())
          print('NATIVE_ROWS',len(json.loads((root/'retained-cases.json').read_text())),'POSTPROCESSOR_FAILURES',summary['failures'])
          for failed in summary['failures']:
              folder=root/failed['name']
              with (folder/'callbacks.tsv').open() as f: blocks=list(csv.DictReader(f,delimiter='\t'))
              with (folder/'events.tsv').open() as f: events=list(csv.DictReader(f,delimiter='\t'))
              print('CASE',failed['name'],'blocks',len(blocks))
              seen={int(b['revision']) for b in blocks}
              for e in events:
                  revision=int(e['revision']);observed=[b for b in blocks if int(b['revision'])==revision]
                  print('EVENT',e,'observed_blocks',len(observed),'first',observed[0] if observed else None)
                  if not observed:
                      timestamp=float(e['published_us']);before=[b for b in blocks if float(b['start_us'])<timestamp];after=[b for b in blocks if float(b['start_us'])>=timestamp]
                      print('MISSING_REVISION',revision,'last_before',before[-1] if before else None,'first_after',after[0] if after else None)
              gaps=[(float(b['start_us'])-float(a['start_us']),a,b) for a,b in zip(blocks,blocks[1:])]
              print('LARGEST_COMPUTE_START_GAPS',sorted(gaps,key=lambda x:x[0],reverse=True)[:3])
          PY
          cp raw/identity.json raw/original-regression/retained-summary.json review/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: persistent-state-postflight-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 14

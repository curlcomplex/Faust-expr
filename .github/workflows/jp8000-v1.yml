name: JP-8000 v1 Faust compile
on:
  push:
    paths:
      - 'modules/jp-8000/**'
      - '.github/workflows/jp8000-v1.yml'
  pull_request:
    paths:
      - 'modules/jp-8000/**'
      - '.github/workflows/jp8000-v1.yml'
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends faust
      - name: Compile JP-8000 voice
        run: |
          faust -v
          faust -lang cpp -I modules/jp-8000/v1 modules/jp-8000/v1/voice.dsp -o /tmp/jp8000.cpp
          test -s /tmp/jp8000.cpp

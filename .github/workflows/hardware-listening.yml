name: Hardware-led synth listening
on:
  push:
    branches: [82-hardware-listening-redo]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: hardware-listening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy python3-scipy python3-soundfile ffmpeg > /tmp/dependencies.log
      - name: Identified hardware and actual Faust
        run: /usr/bin/python3 tools/modules/hardware_reference_prepare.py
      - name: Exact sources
        if: always()
        run: |
          mkdir -p build/hardware-prepare
          git rev-parse HEAD > build/hardware-prepare/commit.txt
          git archive --format=tar HEAD > build/hardware-prepare/source.tar
          faust --version > build/hardware-prepare/faust-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hardware-listening-prepare-${{ github.sha }}
          path: build/hardware-prepare/
          if-no-files-found: error
          retention-days: 14

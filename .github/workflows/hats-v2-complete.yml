name: Analog Classics laboratory qualification
on:
  push:
    branches: [53-analog-hats-full-batch, 55-analog-classics-first-slice, 57-acid-bassline-batch, 60-effects-batch, 63-iron-oxide-ensemble]
    paths: ['modules/hats-analog/**', 'tools/modules/hats_v2*', '.github/workflows/hats-v2-complete.yml', 'modules/trigger-seq/**', 'modules/analog-classics/**', 'modules/acid-voice/**', 'modules/bassline-seq/**', 'modules/vintage-rack-reverb/**', 'modules/tape-echo/**', 'modules/retro-mixer-eq/**', 'modules/vintage-tape/**', 'modules/retro-ensemble/**', 'tools/modules/analog_classics*', 'tools/modules/acid*', 'tools/modules/effects*', 'tools/modules/airwindows_pair.py', 'tools/modules/render.cpp']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'hats-v2-${{ github.ref }}', cancel-in-progress: true}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Compiler and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy python3-scipy
      - name: Syntax checks
        run: |
          /usr/bin/python3 -m py_compile tools/modules/hats_v2_delivery.py tools/modules/hats_v2_reference.py
          if [ -f tools/modules/acid_batch.py ]; then /usr/bin/python3 -m py_compile tools/modules/acid_batch.py; fi
          if [ -f tools/modules/effects_batch.py ]; then /usr/bin/python3 -m py_compile tools/modules/effects_batch.py; fi
          if [ -f tools/modules/airwindows_pair.py ]; then /usr/bin/python3 -m py_compile tools/modules/airwindows_pair.py; fi
      - name: Original hats hardware reference (original branch only)
        if: github.ref_name == '53-analog-hats-full-batch'
        run: /usr/bin/python3 tools/modules/hats_v2_reference.py --references build/hats-v2/references --fetch-only
      - name: Existing actual Faust hats regression
        run: /usr/bin/python3 tools/modules/hats_v2_delivery.py --out build/hats-v2/run
      - name: Existing single-note hats and Trigger Seq regression
        if: github.ref_name != '53-analog-hats-full-batch'
        run: /usr/bin/python3 tools/modules/analog_classics_slice.py --out build/hats-v2/analog-classics
      - name: Drum quartet and original-808 comparisons (drum branch only)
        if: github.ref_name == '55-analog-classics-first-slice'
        run: /usr/bin/python3 tools/modules/analog_classics_drums_v2.py --out build/hats-v2/analog-classics-drums
      - name: Acid single-note voice and Bassline Seq batch
        if: github.ref_name == '57-acid-bassline-batch'
        run: /usr/bin/python3 tools/modules/acid_batch.py --out build/hats-v2/acid-batch
      - name: Vintage rack reverb, tape echo and retro mixer EQ batch
        if: github.ref_name == '60-effects-batch'
        run: /usr/bin/python3 tools/modules/effects_batch.py --out build/hats-v2/effects-batch
      - name: Iron Oxide tape and Ensemble batch
        if: github.ref_name == '63-iron-oxide-ensemble'
        run: /usr/bin/python3 tools/modules/airwindows_pair.py --out build/hats-v2/airwindows-pair
      - name: Original hats comparison (original branch only)
        if: github.ref_name == '53-analog-hats-full-batch'
        run: /usr/bin/python3 tools/modules/hats_v2_reference.py --references build/hats-v2/references --render build/hats-v2/run --out build/hats-v2/audition
      - name: Exact source and compiler evidence
        if: always()
        run: |
          mkdir -p build/hats-v2
          rm -f build/hats-v2/references/*.wav
          git rev-parse HEAD > build/hats-v2/commit.txt
          git archive --format=tar HEAD > build/hats-v2/source.tar
          git diff --check > build/hats-v2/diff-check.txt
          faust --version > build/hats-v2/faust-version.txt
          g++ --version > build/hats-v2/cxx-version.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'analog-classics-${{ github.sha }}', path: build/hats-v2/, if-no-files-found: error, retention-days: 7}

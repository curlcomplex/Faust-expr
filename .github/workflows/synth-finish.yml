name: Synth hardware reference finishing
on:
  push:
    branches: [82-synth-reference-finish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synth-finish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install numerical tools
        run: |
          mkdir -p build/finish
          sudo apt-get update > build/finish/dependencies.log 2>&1
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy python3-scipy python3-soundfile >> build/finish/dependencies.log 2>&1
      - name: Acquire identified hardware descriptors
        run: /usr/bin/python3 tools/modules/synth_finish_materials.py --out build/finish/materials
      - name: Oscillator and hardware comparisons
        if: hashFiles('tools/modules/synth_finish.py') != ''
        run: /usr/bin/python3 tools/modules/synth_finish.py --out build/finish/comparisons
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Retain exact source and evidence
        if: always()
        run: |
          mkdir -p build/finish
          git rev-parse HEAD > build/finish/commit.txt
          git archive --format=tar HEAD > build/finish/source.tar
          faust --version > build/finish/faust-version.txt
          g++ --version > build/finish/cxx-version.txt
          find build/finish -name render -type f -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synth-finish-${{ github.sha }}
          path: build/finish/
          retention-days: 14
          if-no-files-found: error

name: DX7 phase-index identification
on:
  pull_request:
    paths:
      - 'modules/dx7-reference-slice/phase_index_probe.dsp'
      - 'tools/modules/dx7_phase_index.py'
      - 'tools/modules/dx7_msfa_phase_oracle.cpp'
      - '.github/workflows/dx7-phase-index.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dx7-phase-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAUST_VERSION: '2.88.0'
      FAUST_ARCHIVE_SHA256: 'e4e175cf236924b5b7d4784cbb8c50cc01e211159e169655dd9e6d8f92b871d9'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install bounded dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy g++ curl ca-certificates
      - name: Fetch verified Faust 2.88 release
        run: |
          mkdir -p build/dx7-phase/toolchain build/dx7-phase/evidence
          curl --fail --location --retry 3 "https://github.com/grame-cncm/faust/releases/download/${FAUST_VERSION}/faust-${FAUST_VERSION}.tar.gz" -o build/dx7-phase/faust.tar.gz
          echo "$FAUST_ARCHIVE_SHA256  build/dx7-phase/faust.tar.gz" | sha256sum -c -
          tar -xzf build/dx7-phase/faust.tar.gz -C build/dx7-phase/toolchain --strip-components=1
      - name: Build pinned Faust compiler
        run: |
          make -C build/dx7-phase/toolchain/build cmake BACKENDS=regular.cmake TARGETS=regular.cmake > build/dx7-phase/evidence/configure.log 2>&1
          cmake --build build/dx7-phase/toolchain/build/faustdir --target faust --parallel 2 > build/dx7-phase/evidence/compiler-build.log 2>&1
          build/dx7-phase/toolchain/build/bin/faust --version | tee build/dx7-phase/evidence/faust-version.txt
          grep -Fx "FAUST Version $FAUST_VERSION" build/dx7-phase/evidence/faust-version.txt
      - name: Sweep phase/index scale against MSFA
        run: |
          python3 tools/modules/dx7_phase_index.py --out build/dx7-phase/evidence/probe --faust build/dx7-phase/toolchain/build/bin/faust --faust-libraries build/dx7-phase/toolchain/libraries | tee build/dx7-phase/evidence/run.log
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v | tee build/dx7-phase/evidence/regression.log
      - name: Retain source identity
        if: always()
        run: |
          git rev-parse HEAD > build/dx7-phase/evidence/commit.txt
          git archive --format=tar HEAD modules/dx7-reference-slice/phase_index_probe.dsp tools/modules/dx7_phase_index.py tools/modules/dx7_msfa_phase_oracle.cpp .github/workflows/dx7-phase-index.yml > build/dx7-phase/evidence/source.tar
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dx7-phase-index-${{ github.sha }}-${{ github.run_attempt }}
          path: build/dx7-phase/evidence/
          retention-days: 14
          if-no-files-found: error

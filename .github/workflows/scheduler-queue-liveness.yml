name: Scheduler queue publication controls

on:
  pull_request:
    paths:
      - 'scripts/scheduler_liveness_queue_controls.py'
      - '.github/workflows/scheduler-queue-liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-control:
    strategy:
      fail-fast: false
      matrix:
        mode: [fence, atomic]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install previously tested Faust distribution
        run: brew install faust
      - name: Run unchanged liveness matrix with one queue control
        env:
          QUEUE_CONTROL: ${{ matrix.mode }}
        run: |
          python3 -m py_compile scripts/run_scheduler_liveness.py scripts/scheduler_liveness_queue_controls.py
          python3 scripts/scheduler_liveness_queue_controls.py
      - name: Preserve every result and negative case
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduler-queue-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence-liveness/
          if-no-files-found: error
          retention-days: 30

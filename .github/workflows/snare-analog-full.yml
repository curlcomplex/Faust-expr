name: Analog snare full qualification
on:
  push:
    branches: [47-analog-snare-full-batch]
    paths: ['modules/snare-analog/**','tools/modules/snare_analog_batch.py','.github/workflows/snare-analog-full.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snare-analog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy
      - name: Full actual-Faust qualification
        run: /usr/bin/python3 tools/modules/snare_analog_batch.py --out build/snare-analog
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snare-analog-${{ github.sha }}
          path: build/snare-analog/
          if-no-files-found: error
          retention-days: 7

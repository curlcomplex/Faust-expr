name: Upstream Faust loop-split fusion probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/upstream-loop-split.yml'
      - 'scripts/run_upstream_loopsplit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-loop-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  loop-split-macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run pinned upstream loop-split/fusion experiment
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/run_upstream_loopsplit.py
      - name: Publish report
        if: always()
        run: |
          if [ -f evidence-upstream-loopsplit/REPORT.md ]; then
            cat evidence-upstream-loopsplit/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Loop-split probe did not complete; inspect FAILURE.txt and stage logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-loop-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-upstream-loopsplit/
          retention-days: 14
          if-no-files-found: warn

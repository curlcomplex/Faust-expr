name: Airwindows evidence review bundle
on:
  push:
    branches: [63-airwindows-reference-pass]
    paths: ['.github/workflows/airwindows-evidence.yml', 'tools/modules/airwindows_evidence_bundle.py']
permissions: {contents: read, actions: read}
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify and select already-completed evidence (no DSP rerun)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/modules/airwindows_evidence_bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'airwindows-review-fafec2c5', path: build/airwindows-review/, if-no-files-found: error, retention-days: 7}

name: Analog Classics synth reference tuning
on:
  push:
    branches: [82-synth-reference-tuning]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synth-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy python3-scipy
      - name: Existing SH101 gain checkpoint
        run: /usr/bin/python3 tools/modules/synth_reference_pass.py --out build/synth-reference
      - name: Four-synth behavioral checkpoint
        run: /usr/bin/python3 tools/modules/synth_four_voice_checkpoint.py --out build/four-synth
      - name: Oracle-informed candidate comparisons
        run: /usr/bin/python3 tools/modules/synth_oracle_candidates.py --out build/oracle-candidates
      - name: Preserved complete original synth regression
        run: /usr/bin/python3 tools/modules/synth_batch.py --out build/synth-legacy
      - name: Existing unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p build/synth-reference/four-synth build/synth-reference/oracle-candidates
          if test -d build/four-synth; then cp -R build/four-synth/. build/synth-reference/four-synth/; fi
          if test -d build/oracle-candidates; then cp -R build/oracle-candidates/. build/synth-reference/oracle-candidates/; fi
          if test -f build/synth-legacy/results.json; then cp build/synth-legacy/results.json build/synth-reference/legacy-synth-results.json; fi
          git rev-parse HEAD > build/synth-reference/commit.txt
          git archive --format=tar HEAD > build/synth-reference/source.tar
          faust --version > build/synth-reference/faust-version.txt
          g++ --version > build/synth-reference/cxx-version.txt
          lscpu > build/synth-reference/cpu.txt
          find build/synth-reference -name render -type f -delete
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('build/synth-reference')
          (p/'hashes.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synth-reference-${{ github.sha }}
          path: build/synth-reference/
          retention-days: 14
          if-no-files-found: error

name: Scheduler grouped-task scaling

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-scaling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaling-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/libfaust-scheduler
          persist-credentials: false
      - name: Install tested toolchain
        run: |
          brew install faust llvm@22
          faust -v
          "$(brew --prefix llvm@22)/bin/clang++" --version
          sysctl hw.physicalcpu hw.logicalcpu machdep.cpu.brand_string
      - name: Build scheduler runtime and benchmark tools
        run: |
          set -euo pipefail
          mkdir -p build/scaling evidence-scaling
          cp "$(brew --prefix faust)/share/faust/scheduler.cpp" build/scaling/scheduler.cpp
          python3 scripts/patch_scheduler_arm64.py build/scaling/scheduler.cpp
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import run_scheduler_liveness as l
          import scheduler_liveness_queue_controls as q
          p=Path('build/scaling/scheduler.cpp')
          s=l.instrument_runtime(p.read_text(), barrier=False, trace=False)
          s=q.queue_control(s, 'atomic')
          p.write_text(s)
          PY
          LLVM="$(brew --prefix llvm@22)"
          INC="$(faust --includedir)"
          LIB="$(faust --libdir)"
          CXX="$LLVM/bin/clang++"
          cat > build/scaling/target.cpp <<'CPP'
          #include <faust/dsp/llvm-dsp.h>
          #include <iostream>
          int main(){std::cout<<getDSPMachineTarget();}
          CPP
          "$CXX" -std=c++17 -O3 -I"$INC" build/scaling/target.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/target
          TARGET="$(build/scaling/target)"
          TRIPLE="${TARGET%%:*}"
          echo "jit_target=$TARGET" | tee evidence-scaling/environment.txt
          "$CXX" -std=c++17 -O3 -target "$TRIPLE" -I"$INC" -S -emit-llvm build/scaling/scheduler.cpp -o build/scaling/scheduler.ll
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scaling_factory_prep.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/prep
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scheduler_scaling_bench.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/bench
      - name: Prepare heavy cached factories
        run: |
          set -euo pipefail
          for V in 16 32 64; do
            build/scaling/prep scalar "$V" "build/scaling/heavy-scalar-$V.bc" - heavy | tee "evidence-scaling/prep-scalar-$V.txt"
            build/scaling/prep sch "$V" "build/scaling/heavy-sch-$V.bc" build/scaling/scheduler.ll heavy | tee "evidence-scaling/prep-sch-$V.txt"
            build/scaling/prep schg "$V" "build/scaling/heavy-schg-$V.bc" build/scaling/scheduler.ll heavy | tee "evidence-scaling/prep-schg-$V.txt"
          done
      - name: Run grouped-task comparison
        run: |
          set -euo pipefail
          printf 'mode\tvoices\tframes\tparticipants\tmedian_ns_per_frame\tbest_ns_per_frame\tworst_ns_per_frame\n' > evidence-scaling/results.tsv
          for V in 16 32 64; do
            for F in 128 512; do
              B=$(( 262144 / F )); if [ "$B" -lt 512 ]; then B=512; fi
              OUT="$(build/scaling/bench build/scaling/heavy-scalar-$V.bc 1 "$F" "$B")"
              MED="$(echo "$OUT" | awk -F= '/median_ns_per_frame/{print $2}')"; BEST="$(echo "$OUT" | awk -F= '/best_ns_per_frame/{print $2}')"; WORST="$(echo "$OUT" | awk -F= '/worst_ns_per_frame/{print $2}')"
              printf 'scalar\t%s\t%s\t1\t%s\t%s\t%s\n' "$V" "$F" "$MED" "$BEST" "$WORST" >> evidence-scaling/results.tsv
              for MODE in sch schg; do
                for P in 1 2 3; do
                  OUT="$(build/scaling/bench build/scaling/heavy-$MODE-$V.bc "$P" "$F" "$B")"
                  MED="$(echo "$OUT" | awk -F= '/median_ns_per_frame/{print $2}')"; BEST="$(echo "$OUT" | awk -F= '/best_ns_per_frame/{print $2}')"; WORST="$(echo "$OUT" | awk -F= '/worst_ns_per_frame/{print $2}')"
                  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$MODE" "$V" "$F" "$P" "$MED" "$BEST" "$WORST" >> evidence-scaling/results.tsv
                done
              done
            done
          done
          cat evidence-scaling/results.tsv
      - name: Summarize grouped scheduler
        run: |
          python3 - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('evidence-scaling/results.tsv'), delimiter='\t'))
          for r in rows:
              r['voices']=int(r['voices']); r['frames']=int(r['frames']); r['participants']=int(r['participants']); r['median_ns_per_frame']=float(r['median_ns_per_frame'])
          report=[]
          for v,f in sorted({(r['voices'],r['frames']) for r in rows}):
              g=[r for r in rows if r['voices']==v and r['frames']==f]
              by={(r['mode'],r['participants']):r['median_ns_per_frame'] for r in g}
              s=by[('scalar',1)]
              row={'voices':v,'frames':f,'scalar':s}
              for mode in ('sch','schg'):
                  for p in (1,2,3): row[f'{mode}{p}']=by[(mode,p)]
                  row[f'{mode}3_vs_scalar']=s/by[(mode,3)]
                  row[f'{mode}3_vs_{mode}1']=by[(mode,1)]/by[(mode,3)]
              row['grouped_vs_stock_p3']=by[('sch',3)]/by[('schg',3)]
              report.append(row)
          print('voices frames stock3/scalar grouped3/scalar grouped/stock@3 grouped-1to3')
          for r in report:
              print(f"{r['voices']:>6} {r['frames']:>6} {r['sch3_vs_scalar']:>13.3f} {r['schg3_vs_scalar']:>15.3f} {r['grouped_vs_stock_p3']:>15.3f} {r['schg3_vs_schg1']:>12.3f}")
          open('evidence-scaling/summary.json','w').write(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-grouped-${{ github.sha }}
          path: evidence-scaling/
          retention-days: 14

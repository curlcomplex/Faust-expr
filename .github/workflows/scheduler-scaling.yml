name: Scheduler coarse-region scaling

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-scaling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scaling-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/libfaust-scheduler
          persist-credentials: false
      - name: Install tested toolchain
        run: |
          brew install faust llvm@22
          faust -v
          sysctl hw.physicalcpu hw.logicalcpu machdep.cpu.brand_string
      - name: Build runtime and benchmark tools
        run: |
          set -euo pipefail
          mkdir -p build/scaling evidence-scaling
          cp "$(brew --prefix faust)/share/faust/scheduler.cpp" build/scaling/scheduler.cpp
          python3 scripts/patch_scheduler_arm64.py build/scaling/scheduler.cpp
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import run_scheduler_liveness as l
          import scheduler_liveness_queue_controls as q
          p=Path('build/scaling/scheduler.cpp')
          s=l.instrument_runtime(p.read_text(), barrier=False, trace=False)
          s=q.queue_control(s, 'atomic')
          p.write_text(s)
          PY
          LLVM="$(brew --prefix llvm@22)"; INC="$(faust --includedir)"; LIB="$(faust --libdir)"; CXX="$LLVM/bin/clang++"
          cat > build/scaling/target.cpp <<'CPP'
          #include <faust/dsp/llvm-dsp.h>
          #include <iostream>
          int main(){std::cout<<getDSPMachineTarget();}
          CPP
          "$CXX" -std=c++17 -O3 -I"$INC" build/scaling/target.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/target
          TARGET="$(build/scaling/target)"; TRIPLE="${TARGET%%:*}"
          echo "jit_target=$TARGET" | tee evidence-scaling/environment.txt
          "$CXX" -std=c++17 -O3 -target "$TRIPLE" -I"$INC" -S -emit-llvm build/scaling/scheduler.cpp -o build/scaling/scheduler.ll
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scaling_factory_prep.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/prep
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scheduler_scaling_bench.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/bench
          "$CXX" -std=c++20 -O3 -I"$INC" scripts/coarse_scalar_bench.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/scaling/coarse
      - name: Prepare region and full-graph factories
        run: |
          set -euo pipefail
          for R in 16 32; do
            T=$((R * 3))
            build/scaling/prep scalar "$R" "build/scaling/region-$R.bc" - heavy | tee "evidence-scaling/prep-region-$R.txt"
            build/scaling/prep scalar "$T" "build/scaling/fused-$T.bc" - heavy | tee "evidence-scaling/prep-fused-$T.txt"
            build/scaling/prep sch "$T" "build/scaling/sch-$T.bc" build/scaling/scheduler.ll heavy | tee "evidence-scaling/prep-sch-$T.txt"
          done
      - name: Run coarse-region comparison
        run: |
          set -euo pipefail
          printf 'region_voices\ttotal_voices\tframes\tmode\tmedian_ns_per_frame\tbest_ns_per_frame\tworst_ns_per_frame\n' > evidence-scaling/results.tsv
          for R in 16 32; do
            T=$((R * 3))
            for F in 128 512; do
              B=$(( 196608 / F )); if [ "$B" -lt 384 ]; then B=384; fi
              for MODE in fused coarse sch; do
                if [ "$MODE" = fused ]; then OUT="$(build/scaling/bench build/scaling/fused-$T.bc 1 "$F" "$B")"; fi
                if [ "$MODE" = sch ]; then OUT="$(build/scaling/bench build/scaling/sch-$T.bc 3 "$F" "$B")"; fi
                if [ "$MODE" = coarse ]; then OUT="$(build/scaling/coarse build/scaling/region-$R.bc "$F" "$B")"; fi
                MED="$(echo "$OUT" | awk -F= '/median_ns_per_frame/{print $2}')"; BEST="$(echo "$OUT" | awk -F= '/best_ns_per_frame/{print $2}')"; WORST="$(echo "$OUT" | awk -F= '/worst_ns_per_frame/{print $2}')"
                printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$R" "$T" "$F" "$MODE" "$MED" "$BEST" "$WORST" >> evidence-scaling/results.tsv
              done
            done
          done
          cat evidence-scaling/results.tsv
      - name: Summarize coarse regions
        run: |
          python3 - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('evidence-scaling/results.tsv'),delimiter='\t'))
          for r in rows:
              r['region_voices']=int(r['region_voices']); r['total_voices']=int(r['total_voices']); r['frames']=int(r['frames']); r['median_ns_per_frame']=float(r['median_ns_per_frame'])
          report=[]
          for R,T,F in sorted({(r['region_voices'],r['total_voices'],r['frames']) for r in rows}):
              g={r['mode']:r['median_ns_per_frame'] for r in rows if r['region_voices']==R and r['frames']==F}
              report.append({'region':R,'total':T,'frames':F,**g,'coarse_vs_fused':g['fused']/g['coarse'],'coarse_vs_sch':g['sch']/g['coarse']})
          print('region total frames coarse/fused coarse-vs-sch')
          for r in report: print(f"{r['region']:>6} {r['total']:>5} {r['frames']:>6} {r['coarse_vs_fused']:>12.3f} {r['coarse_vs_sch']:>13.3f}")
          open('evidence-scaling/summary.json','w').write(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coarse-scalar-${{ github.sha }}
          path: evidence-scaling/
          retention-days: 14

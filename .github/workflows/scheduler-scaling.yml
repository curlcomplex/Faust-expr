name: Existing Faust options and linkage controls

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-scaling.yml'
      - 'scripts/run_existing_faust_options.py'
      - 'scripts/scaling_factory_prep.cpp'
      - 'scripts/scheduler_scaling_bench.cpp'
      - 'scripts/patch_scheduler_arm64.py'
      - 'scripts/run_scheduler_liveness.py'
      - 'scripts/scheduler_liveness_queue_controls.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faust-existing-options-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  existing-options-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install toolchain (driver verifies exact versions)
        run: brew install faust llvm@22
      - name: Existing lab and analysis self-tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/run_existing_faust_options.py --self-test
          bash scripts/build.sh
      - name: Existing optimizer, chunk-size, grouping and linkage experiment
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 scripts/run_existing_faust_options.py
      - name: Publish report in Actions
        if: always()
        run: |
          if [ -f evidence-existing-options/REPORT.md ]; then
            cat evidence-existing-options/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Experiment incomplete; inspect errors.json and stage logs. No performance conclusion.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: faust-existing-options-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence-existing-options/
            evidence/
          retention-days: 14
          if-no-files-found: error

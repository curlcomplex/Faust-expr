name: Faust compile and audio evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faust-smoke-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Standard hosted runner; no paid larger runner. No personal-machine access.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this public repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install distribution compiler and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ python3-numpy python3-matplotlib
      - name: Check analyser failure detection
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile actual Faust, render, and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          PATH=/usr/bin:/bin:$PATH bash scripts/build.sh 2>&1 | tee evidence/build.log
      - name: Compile and render the first module experiment
        if: hashFiles('modules/kick-pm/kick.dsp') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/kick-pm-01 evidence
          PATH=/usr/bin:/bin:$PATH /usr/bin/python3 tools/modules/lab.py --out build/kick-pm-01 2>&1 | tee evidence/module-run.log
      - name: Compile reference-led body candidates without external recordings
        if: hashFiles('tools/modules/build_pilot.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:$PATH /usr/bin/python3 tools/modules/build_pilot.py --out build/kick-pm-02
      - name: Verify gated color candidate and ablations
        if: hashFiles('tools/modules/color_probe.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          PATH=/usr/bin:/bin:$PATH /usr/bin/python3 tools/modules/color_probe.py --out build/kick-color-04
      - name: Save commit-specific audio and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faust-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/kick-pm-01/
            build/kick-pm-02/
            build/kick-color-04/
          if-no-files-found: warn
          retention-days: 3

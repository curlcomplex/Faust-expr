name: Faust compile and audio evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faust-smoke-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Standard hosted runner; no paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out this public repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distribution compiler and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust libfaust-static g++ python3-numpy python3-matplotlib
      - name: Check analyser failure detection
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile actual Faust, render, and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          # Use the same distribution Python as the apt-installed libraries.
          PATH=/usr/bin:/bin:$PATH bash scripts/build.sh 2>&1 | tee evidence/build.log
      - name: Probe libfaust LLVM vector and scheduler modes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          FAUST_INCLUDE="$(faust --includedir)"
          FAUST_LIB="$(ldconfig -p | awk '/libfaust\.so\.2/{print $NF; exit}')"
          printf 'include=%s\nlib=%s\n' "$FAUST_INCLUDE" "$FAUST_LIB" | tee evidence/jit-environment.txt
          g++ -std=c++17 -O2 -I"$FAUST_INCLUDE" scripts/jit_scheduler_probe.cpp "$FAUST_LIB" -lpthread -ldl -lz -o build/jit_scheduler_probe 2>&1 | tee evidence/jit-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "JIT probe build failed: $build_status" | tee evidence/jit-summary.txt
            exit "$build_status"
          fi
          : > evidence/jit-summary.txt
          overall=0
          set +e
          for mode in scalar vec32 vec64 sch; do
            echo "=== $mode ===" | tee -a evidence/jit-summary.txt
            timeout 30s build/jit_scheduler_probe "$mode" >"evidence/jit-${mode}.txt" 2>&1
            status=$?
            cat "evidence/jit-${mode}.txt" | tee -a evidence/jit-summary.txt
            echo "exit_status=$status" | tee -a evidence/jit-summary.txt
            # Scalar and vector modes are required to work; scheduler failure is
            # evidence for this research branch, not a reason to hide artifacts.
            if [ "$mode" != sch ] && [ "$status" -ne 0 ]; then overall=$status; fi
          done
          set -e
          exit "$overall"
      - name: Save commit-specific audio and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faust-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 3

name: Analysis review regressions
on:
  pull_request:
    paths:
      - 'tools/modules/spectral_trace.py'
      - 'tools/modules/harmonic_analysis.py'
      - 'tests/test_analysis_review_fixes.py'
      - '.github/workflows/analysis-review-fixes.yml'
  push:
    branches: [main]
    paths:
      - 'tools/modules/spectral_trace.py'
      - 'tools/modules/harmonic_analysis.py'
      - 'tests/test_analysis_review_fixes.py'
      - '.github/workflows/analysis-review-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install numerical test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy
      - name: Run review regression tests
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest tests.test_analysis_review_fixes -v

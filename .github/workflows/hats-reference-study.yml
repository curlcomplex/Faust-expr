name: Hats reference study
on:
  push:
    branches: [53-analog-hats-full-batch]
    paths: ['.github/workflows/hats-reference-study.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Direct-output identified TR-808 reference
        run: |
          mkdir -p build/hats-reference
          python3 - <<'PY'
          import urllib.request,hashlib,json,pathlib,datetime
          out=pathlib.Path('build/hats-reference')
          urls={
            'page.html':'https://www.synthmania.com/tr-808.htm',
            '808_open.wav':'https://www.synthmania.com/Roland%20TR-808/Audio/Instrument%20samples/TR-808%20Open%20High%20Hat.wav',
            '808_closed.wav':'https://www.synthmania.com/Roland%20TR-808/Audio/Instrument%20samples/TR-808%20Closed%20High%20Hat.wav'
          }
          manifest={'instrument':'Roland TR-808 serial 209265','source':'Synthmania original direct-output recordings','settings':'Knobs varied in real time, exact values/gain unknown. Not controlled knob calibration.','rights':'Source explicitly permits downloading, editing and sampling. Analysis references only; runtime synth uses no samples.','retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':{}}
          for name,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as r: data=r.read(40_000_001)
              if len(data)>40_000_000:raise ValueError('size limit')
              if name.endswith('.wav') and data[:4]!=b'RIFF':raise ValueError('not WAV: '+name)
              (out/name).write_bytes(data)
              manifest['files'][name]={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'hats-original-808-reference', path: build/hats-reference/, if-no-files-found: error, retention-days: 7}

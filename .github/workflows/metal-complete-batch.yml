name: Metal PM full batch
on:
  push:
    branches: [17-metal-full-batch]
    paths: ['modules/metal-pm/**','.github/workflows/metal-complete-batch.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends faust g++
      - name: Compile scalar and vector actual Faust
        run: |
          set -euo pipefail
          mkdir -p build/metal/scalar build/metal/vector
          faust -I modules/metal-pm -lang cpp -single -cn ModuleDSP modules/metal-pm/metal.dsp -o build/metal/scalar/generated.hpp
          faust -I modules/metal-pm -lang cpp -single -vec -lv 0 -vs 32 -cn ModuleDSP modules/metal-pm/metal.dsp -o build/metal/vector/generated.hpp
          c++ -std=c++17 -O2 -ffp-contract=off -Ibuild/metal/scalar tools/modules/render.cpp -o build/metal/scalar/render
          c++ -std=c++17 -O2 -ffp-contract=off -Ibuild/metal/vector tools/modules/render.cpp -o build/metal/vector/render
          build/metal/scalar/render --controls > build/metal/controls.tsv
          build/metal/vector/render --controls > build/metal/vector-controls.tsv
          cmp build/metal/controls.tsv build/metal/vector-controls.tsv
          grep -q $'^io\\t0\\t1$' build/metal/controls.tsv
          grep -q '^color' build/metal/controls.tsv
          grep -q '^shape' build/metal/controls.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metal-bootstrap-${{ github.sha }}
          path: build/metal/
          if-no-files-found: error
          retention-days: 7

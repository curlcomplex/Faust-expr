name: Faust 2.88 analysis qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faust-analysis-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      FAUST_VERSION: '2.88.0'
      FAUST_ARCHIVE_SHA256: 'e4e175cf236924b5b7d4784cbb8c50cc01e211159e169655dd9e6d8f92b871d9'
      EXECUTION_LANE: github-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy ffmpeg g++
      - name: Fast contracts
        run: |
          mkdir -p build/faust-analysis/evidence
          /usr/bin/python3 -m unittest tests.test_faust_analysis tests.test_render_probes tests.test_spectral_trace -v 2>&1 | tee build/faust-analysis/evidence/contracts.log
      - name: Fetch complete pinned Faust release
        run: |
          set -euo pipefail
          mkdir -p build/faust-analysis/toolchain
          curl --fail --location --retry 3 "https://github.com/grame-cncm/faust/releases/download/${FAUST_VERSION}/faust-${FAUST_VERSION}.tar.gz" -o build/faust-analysis/faust.tar.gz
          echo "$FAUST_ARCHIVE_SHA256  build/faust-analysis/faust.tar.gz" | sha256sum -c -
          tar -xzf build/faust-analysis/faust.tar.gz -C build/faust-analysis/toolchain --strip-components=1
      - name: Build pinned Faust
        run: |
          set -euo pipefail
          make -C build/faust-analysis/toolchain/build cmake BACKENDS=regular.cmake TARGETS=regular.cmake > build/faust-analysis/evidence/configure.log 2>&1
          cmake --build build/faust-analysis/toolchain/build/faustdir --target faust --parallel 2 > build/faust-analysis/evidence/compiler-build.log 2>&1
          build/faust-analysis/toolchain/build/bin/faust --version | tee build/faust-analysis/evidence/faust-version.txt
      - name: Existing metering qualification
        env:
          FAUST_ANALYSIS_INTEGRATION: '1'
          FAUST: ${{ github.workspace }}/build/faust-analysis/toolchain/build/bin/faust
          FAUST_LIBRARIES: ${{ github.workspace }}/build/faust-analysis/toolchain/libraries
          FAUST_ARCHIVE: ${{ github.workspace }}/build/faust-analysis/faust.tar.gz
          FAUST_ANALYSIS_EVIDENCE: ${{ github.workspace }}/build/faust-analysis/evidence/qualification
        run: /usr/bin/python3 -m unittest tests.test_faust_analysis -v 2>&1 | tee build/faust-analysis/evidence/qualification.log
      - name: Existing probe qualification
        env:
          FAUST_PROBE_INTEGRATION: '1'
          FAUST: ${{ github.workspace }}/build/faust-analysis/toolchain/build/bin/faust
          FAUST_LIBRARIES: ${{ github.workspace }}/build/faust-analysis/toolchain/libraries
          FAUST_ARCHIVE: ${{ github.workspace }}/build/faust-analysis/faust.tar.gz
          FAUST_PROBE_EVIDENCE: ${{ github.workspace }}/build/faust-analysis/evidence/probes
        run: /usr/bin/python3 -m unittest tests.test_render_probes -v 2>&1 | tee build/faust-analysis/evidence/probe-qualification.log
      - name: Spectral descriptor trend qualification
        env:
          SPECTRAL_TRACE_INTEGRATION: '1'
          FAUST: ${{ github.workspace }}/build/faust-analysis/toolchain/build/bin/faust
          FAUST_LIBRARIES: ${{ github.workspace }}/build/faust-analysis/toolchain/libraries
        run: /usr/bin/python3 -m unittest tests.test_spectral_trace -v 2>&1 | tee build/faust-analysis/evidence/spectral-qualification.log
      - name: Retain source evidence
        if: always()
        run: |
          git rev-parse HEAD > build/faust-analysis/evidence/commit.txt
          git archive --format=tar HEAD tools/modules/faust_spectral_descriptors.dsp tools/modules/spectral_trace.py tests/test_spectral_trace.py .github/workflows/faust-analysis-288.yml > build/faust-analysis/evidence/spectral-source.tar
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faust-analysis-288-${{ github.sha }}-${{ github.run_attempt }}
          path: build/faust-analysis/evidence/
          retention-days: 14
          if-no-files-found: error

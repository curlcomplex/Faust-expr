name: Probe-aware renderer qualification
on:
  pull_request:
    paths:
      - 'tools/modules/render.cpp'
      - 'tests/fixtures/probe_debug.dsp'
      - 'tests/test_probe_renderer.py'
      - '.github/workflows/probe-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install Faust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ python3
      - name: Fast contracts
        run: python3 -m unittest tests.test_probe_renderer -v
      - name: Compile real debug.lib fixture and runner
        run: |
          set -euo pipefail
          mkdir -p build/probe
          faust -lang cpp -single -cn ModuleDSP tests/fixtures/probe_debug.dsp -o build/probe/generated.hpp
          g++ -std=c++17 -O2 -Ibuild/probe tools/modules/render.cpp -o build/probe/runner
      - name: Verify metadata, control isolation, capture and audio identity
        run: |
          set -euo pipefail
          : > build/probe/score.txt
          python3 - <<'PY'
          import struct
          with open('build/probe/in.f32','wb') as f:
              for i in range(256): f.write(struct.pack('<f', (i%17-8)/8))
          PY
          build/probe/runner --ui > build/probe/ui.json
          grep -F 'probe:1060' build/probe/ui.json
          grep -F 'probe:1061' build/probe/ui.json
          build/probe/runner --controls > build/probe/controls.txt
          grep -F $'gain\t' build/probe/controls.txt
          ! grep -F 'probe:' build/probe/controls.txt
          build/probe/runner build/probe/score.txt build/probe/clean.f32 48000 64 256 0 build/probe/in.f32
          build/probe/runner build/probe/score.txt build/probe/probed.f32 48000 64 256 0 build/probe/in.f32 --probes build/probe/probes.tsv --probe-stride 8
          cmp build/probe/clean.f32 build/probe/probed.f32
          test "$(wc -l < build/probe/probes.tsv)" -eq 33
          # A probe is read-only: score writes by stable probe ID must fail.
          printf '0 probe:1060 0\n' > build/probe/bad-score.txt
          ! build/probe/runner build/probe/bad-score.txt build/probe/bad.f32 48000 64 256 0 build/probe/in.f32
      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: probe-renderer-${{ github.sha }}
          path: |
            build/probe/ui.json
            build/probe/controls.txt
            build/probe/probes.tsv
          retention-days: 14
          if-no-files-found: warn

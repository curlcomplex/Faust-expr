name: Scheduler cached-JIT scaling quick

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-scaling-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/libfaust-scheduler
      - name: Install tested toolchain
        run: brew install faust llvm@22
      - name: Build runtime and tools
        run: |
          set -euo pipefail
          mkdir -p build/qscale evidence-qscale
          cp "$(brew --prefix faust)/share/faust/scheduler.cpp" build/qscale/scheduler.cpp
          python3 scripts/patch_scheduler_arm64.py build/qscale/scheduler.cpp
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          import run_scheduler_liveness as l
          import scheduler_liveness_queue_controls as q
          p=Path('build/qscale/scheduler.cpp')
          p.write_text(q.queue_control(l.instrument_runtime(p.read_text(),False,False),'atomic'))
          PY
          LLVM="$(brew --prefix llvm@22)"; INC="$(faust --includedir)"; LIB="$(faust --libdir)"; CXX="$LLVM/bin/clang++"
          cat > build/qscale/target.cpp <<'CPP'
          #include <faust/dsp/llvm-dsp.h>
          #include <iostream>
          int main(){std::cout<<getDSPMachineTarget();}
          CPP
          "$CXX" -std=c++17 -O3 -I"$INC" build/qscale/target.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/qscale/target
          TARGET="$(build/qscale/target)"; TRIPLE="${TARGET%%:*}"
          sysctl hw.physicalcpu hw.logicalcpu machdep.cpu.brand_string | tee evidence-qscale/environment.txt
          echo "target=$TARGET" | tee -a evidence-qscale/environment.txt
          "$CXX" -std=c++17 -O3 -target "$TRIPLE" -I"$INC" -S -emit-llvm build/qscale/scheduler.cpp -o build/qscale/scheduler.ll
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scaling_factory_prep.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/qscale/prep
          "$CXX" -std=c++17 -O3 -I"$INC" scripts/scheduler_scaling_bench.cpp -L"$LIB" -Wl,-rpath,"$LIB" -lfaust -lpthread -lz -o build/qscale/bench
      - name: Prepare and benchmark quick matrix
        run: |
          set -euo pipefail
          printf 'mode\tvoices\tframes\tparticipants\tmedian_ns_per_frame\n' > evidence-qscale/results.tsv
          for V in 64 256; do
            for MODE in scalar vec; do build/qscale/prep "$MODE" "$V" "build/qscale/$MODE-$V.bc" - >/dev/null; done
            build/qscale/prep sch "$V" "build/qscale/sch-$V.bc" build/qscale/scheduler.ll >/dev/null
            for F in 128 512; do
              B=256
              for MODE in scalar vec; do
                O="$(build/qscale/bench build/qscale/$MODE-$V.bc 1 "$F" "$B")"
                M="$(echo "$O" | awk -F= '/median_ns_per_frame/{print $2}')"
                printf '%s\t%s\t%s\t1\t%s\n' "$MODE" "$V" "$F" "$M" >> evidence-qscale/results.tsv
              done
              for P in 1 2 3; do
                O="$(build/qscale/bench build/qscale/sch-$V.bc "$P" "$F" "$B")"
                M="$(echo "$O" | awk -F= '/median_ns_per_frame/{print $2}')"
                printf 'sch\t%s\t%s\t%s\t%s\n' "$V" "$F" "$P" "$M" >> evidence-qscale/results.tsv
              done
            done
          done
          cat evidence-qscale/results.tsv
          python3 - <<'PY'
          import csv,json
          rs=list(csv.DictReader(open('evidence-qscale/results.tsv'),delimiter='\t'))
          for r in rs:
              r['voices']=int(r['voices']);r['frames']=int(r['frames']);r['participants']=int(r['participants']);r['median_ns_per_frame']=float(r['median_ns_per_frame'])
          out=[]
          for v in (64,256):
            for f in (128,512):
              g={(r['mode'],r['participants']):r['median_ns_per_frame'] for r in rs if r['voices']==v and r['frames']==f}
              s=g[('scalar',1)]; ve=g[('vec',1)]; a=g[('sch',1)]; b=g[('sch',2)]; c=g[('sch',3)]
              x={'voices':v,'frames':f,'scalar':s,'vec':ve,'sch1':a,'sch2':b,'sch3':c,
                 'vec_vs_scalar':s/ve,'sch2_vs_sch1':a/b,'sch3_vs_sch1':a/c,'sch2_vs_scalar':s/b,'sch3_vs_scalar':s/c}
              out.append(x); print(json.dumps(x))
          open('evidence-qscale/summary.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-qscale-${{ github.sha }}
          path: evidence-qscale/
          retention-days: 14

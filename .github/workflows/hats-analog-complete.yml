name: Analog Hats complete qualification
on:
  push:
    branches: [53-analog-hats-full-batch]
    paths: ['modules/hats-analog/**','tools/modules/hats_analog_delivery.py','.github/workflows/hats-analog-complete.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: 'hats-analog-${{ github.ref }}', cancel-in-progress: true}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {OPENBLAS_NUM_THREADS: '1', OMP_NUM_THREADS: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends faust g++ ffmpeg python3-numpy python3-scipy curl
      - name: Capture three dedicated Mutant Hi-Hats reference demos
        run: |
          mkdir -p build/hats-analog/references/full build/hats-analog/reference-excerpts
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,urllib.request
          out=pathlib.Path('build/hats-analog/references/full')
          refs={
            'choke_modes':'https://www.amazona.de/wp-content/uploads/2023/01/05-Hexinverter-Mutant-Hihats-Unterschied_OFF_EXCLUSIVE_FADE.mp3',
            'filter_sweep':'https://www.amazona.de/wp-content/uploads/2023/01/06-Hexinverter-Mutant-Hihats-Filter-Sweep.mp3',
            'external_mod':'https://www.amazona.de/wp-content/uploads/2023/01/07-Hexinverter-Mutant-Hihats-Modulation-External-Input.mp3'
          }
          manifest={'source_page':'https://www.amazona.de/test-hexinverter-mutant-bd9-snare-hihats/','instrument':'Hexinverter Mutant Hi-Hats','refs':{},'rights':'Third-party review audio used only for analysis and short A/B excerpts; never runtime content.','settings':'Reviewer demonstrations; exact knob values/capture gain generally unknown.'}
          for name,url in refs.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=60) as r:data=r.read(25_000_001)
            if len(data)>25_000_000: raise ValueError('reference too large')
            p=out/(name+'.mp3');p.write_bytes(data)
            dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True).strip())
            manifest['refs'][name]={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'duration_seconds':dur}
          pathlib.Path('build/hats-analog/references/manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Actual Faust qualification and authored range bank
        run: /usr/bin/python3 tools/modules/hats_analog_delivery.py --out build/hats-analog/run
      - name: Make short review excerpts only
        run: |
          # Keep short excerpts for listening criticism; remove complete copyrighted review recordings before upload.
          ffmpeg -v error -y -ss 0 -t 6 -i build/hats-analog/references/full/choke_modes.mp3 -ac 1 -ar 48000 build/hats-analog/reference-excerpts/01_Mutant_choke_excerpt.wav
          ffmpeg -v error -y -ss 0 -t 6 -i build/hats-analog/references/full/filter_sweep.mp3 -ac 1 -ar 48000 build/hats-analog/reference-excerpts/02_Mutant_filter_excerpt.wav
          ffmpeg -v error -y -ss 0 -t 6 -i build/hats-analog/references/full/external_mod.mp3 -ac 1 -ar 48000 build/hats-analog/reference-excerpts/03_Mutant_external_excerpt.wav
          rm -rf build/hats-analog/references/full
          cat > build/hats-analog/LISTEN.md <<'EOF'
          # Analog Hats listening

          Start with `run/Analog_Hats_8_presets.wav`: each two-second block is one preset. Pattern is CH, CH, OH, then OH followed by CH so Choke is audible. Presets: Classic, Soft, Crunch, Glass, Dust, LowMetal, Acid, Long.

          The three `reference-excerpts` are short excerpts from the AMAZONA.de Mutant Hi-Hats review examples: choke interaction, filter sweep, and external-source/modulation range. They are context, not calibration, and the runtime synth contains none of this audio.
          EOF
      - name: Source evidence
        if: always()
        run: |
          git rev-parse HEAD > build/hats-analog/commit.txt
          git archive --format=tar HEAD > build/hats-analog/source.tar
          git diff --check > build/hats-analog/diff-check.txt
          faust --version > build/hats-analog/faust-version.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'analog-hats-${{ github.sha }}', path: build/hats-analog/, if-no-files-found: error, retention-days: 7}

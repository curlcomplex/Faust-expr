name: Morph v2 full delivery
on:
  push:
    branches: [20-morph-wavetable-full-batch]
    paths: ['modules/morph-wavetable/v2/**','tools/modules/morph_v2*','tools/modules/generate_morph_bank.py','tests/test_morph_v2.py','.github/workflows/morph-v2.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: morph-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Dependencies on disposable hosted runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends faust g++ ffmpeg python3-numpy python3-scipy
      - name: Generate authored bank and actual Faust implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/modules/generate_morph_bank.py --out build/morph-v2/bank
          for kind in reference morph envelope tuning; do
            mkdir -p build/morph-v2/$kind
            faust -I modules/morph-wavetable/v2 -I build/morph-v2/bank -lang cpp -single -cn ModuleDSP modules/morph-wavetable/v2/$kind.dsp -o build/morph-v2/$kind/generated.hpp
            c++ -std=c++17 -O2 -ffp-contract=off -Ibuild/morph-v2/$kind tools/modules/render.cpp -o build/morph-v2/$kind/render
          done
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p build/morph-v2
          git rev-parse HEAD > build/morph-v2/commit.txt
          git archive --format=tar HEAD > build/morph-v2/source.tar
          faust -v > build/morph-v2/faust-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: morph-v2-${{ github.sha }}
          path: build/morph-v2/
          if-no-files-found: error
          retention-days: 7

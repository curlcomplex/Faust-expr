name: Adaptive retained groups - public macOS
on:
  push:
    branches: [research/adaptive-retained-groups]
    paths:
      - 'experiments/adaptive-groups/**'
      - '.github/workflows/adaptive-retained-groups.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-retained-groups-public
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.repository == 'curlcomplex/Faust-expr' && github.actor == 'curlcomplex' && github.ref == 'refs/heads/research/adaptive-retained-groups'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      GIT_LFS_SKIP_SMUDGE: 1
      CURLOP_FAUST_BACKEND: jit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Toolchain and policy checks
        run: |
          set -euo pipefail
          brew install faust
          python3 -m venv .venv-adaptive
          .venv-adaptive/bin/pip install numpy matplotlib
          echo "$GITHUB_WORKSPACE/.venv-adaptive/bin" >> "$GITHUB_PATH"
          mkdir -p evidence/adaptive-environment
          { git rev-parse HEAD; uname -sm; sw_vers; sysctl hw.physicalcpu hw.logicalcpu machdep.cpu.brand_string; faust -v; clang++ --version; cmake --version; } > evidence/adaptive-environment/environment.txt 2>&1
          python3 experiments/adaptive-groups/test_policy.py > evidence/adaptive-environment/policy-tests.txt 2>&1
          git archive HEAD experiments/adaptive-groups experiments/retained-groups experiments/retained-host vendor/curlop-latency | gzip > evidence/adaptive-environment/executed-source.tar.gz
      - name: Execute adaptive policy plus exact retained-group native regression
        run: python3 experiments/adaptive-groups/adaptive_bench.py --output evidence/adaptive
      - name: Retain evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-retained-groups-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/adaptive/
            evidence/adaptive-environment/
          if-no-files-found: error
          retention-days: 14

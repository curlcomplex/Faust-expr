name: Cymbal frozen modulation replay check
on:
  push:
    branches: [cym-id-materials-01]
    paths:
      - '.github/workflows/cymbal-data-replay.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Reproduce generator values for lossless model transport
        run: |
          mkdir -p replay
          python - <<'PY'
          import numpy as np,hashlib,json,platform
          from pathlib import Path
          rng=np.random.default_rng(1609)
          rng.standard_normal(1853)
          a=rng.standard_normal((1853,57)).astype('<f8')
          np.save('replay/raw-normal-values.npy',a,allow_pickle=False)
          Path('replay/report.json').write_text(json.dumps({'purpose':'Verify exact deterministic numerical-data reconstruction before using it to transport the frozen model; NOT synthesis or a new modulation model.','platform':platform.platform(),'numpy':np.__version__,'array_bytes_sha256':hashlib.sha256(a.tobytes()).hexdigest(),'shape':list(a.shape)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cymbal-modulation-replay-${{ github.sha }}
          path: replay/
          retention-days: 7
